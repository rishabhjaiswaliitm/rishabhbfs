<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History of Ancient World Glocal - Cities, Civilizations, and Sources MCQ Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="page-selector" aria-label="Choose question page">
        <div>
          <p class="kicker">Question Set</p>
          <h2 id="pageTitle">Page 3</h2>
        </div>
        <div class="selector-controls">
          <label class="lecture-select-label" for="lectureSelect">Lecture</label>
          <select class="lecture-select" id="lectureSelect"></select>
          <div class="page-buttons" id="pageButtons"></div>
        </div>
      </section>

      <section class="play-area" aria-live="polite">
        <aside class="scoreboard">
          <div class="metric">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="metric">
            <span>Question</span>
            <strong><span id="currentQuestion">1</span>/<span id="totalQuestions">8</span></strong>
          </div>
          <div class="metric">
            <span>Streak</span>
            <strong id="streak">0</strong>
          </div>
          <button class="ghost-button" id="exportPdfButton" type="button">Export PDF</button>
          <button class="ghost-button" id="restartButton" type="button">Restart</button>
        </aside>

        <article class="quiz-card">
          <div class="progress-track" aria-hidden="true">
            <div id="progressFill"></div>
          </div>

          <p class="topic" id="topic">Approaching Ancient History</p>
          <h2 id="questionText"></h2>

          <div class="answers" id="answers"></div>

          <div class="feedback" id="feedback" hidden>
            <strong id="feedbackTitle"></strong>
            <p id="feedbackText"></p>
          </div>

          <div class="actions">
            <button class="primary-button" id="nextButton" type="button" disabled>Next Question</button>
          </div>
        </article>
      </section>

      <section class="hero-panel" aria-label="Ancient city quiz theme">
        <div class="skyline" aria-hidden="true">
          <svg viewBox="0 0 900 260" role="img">
            <defs>
              <linearGradient id="sunset" x1="0" x2="1" y1="0" y2="1">
                <stop class="sky-stop-1" offset="0" stop-color="#18262c" />
                <stop class="sky-stop-2" offset="0.52" stop-color="#263b44" />
                <stop class="sky-stop-3" offset="1" stop-color="#0b1114" />
              </linearGradient>
            </defs>
            <rect width="900" height="260" fill="url(#sunset)" />
            <circle class="sky-sun" cx="690" cy="72" r="38" fill="#f7d17b" opacity="0.88" />
            <path class="sky-hills" d="M0 214 L70 190 L122 206 L188 174 L260 196 L330 162 L410 188 L496 146 L582 184 L668 156 L742 190 L828 168 L900 194 L900 260 L0 260 Z" fill="#132126" opacity="0.82" />
            <path class="sky-buildings" d="M0 232 H52 V184 H90 V232 H126 V154 H166 V232 H206 V174 H250 V232 H290 V132 H332 V232 H370 V168 H418 V232 H466 V144 H506 V232 H548 V184 H590 V232 H640 V126 H682 V232 H728 V160 H770 V232 H816 V180 H858 V232 H900 V260 H0 Z" fill="#070b0d" />
            <path class="sky-roofs" d="M118 154 H174 L146 112 Z M284 132 H338 L311 84 Z M636 126 H688 L662 76 Z" fill="#070b0d" />
          </svg>
        </div>

        <div class="title-block">
          <div class="title-topline">
            <p class="kicker">Lecture 1</p>
            <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
              <span class="toggle-icon" aria-hidden="true"></span>
              <span id="themeToggleText">Light Mode</span>
            </button>
          </div>
          <h1>History of Ancient World Glocal: Cities, Civilizations, and Sources</h1>
          <p class="subtitle">Answer source-based questions, build a streak, and test how well you understood the opening lecture.</p>
        </div>
      </section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
